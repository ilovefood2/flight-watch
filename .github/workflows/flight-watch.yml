name: flight-watch

on:
  schedule:
    # Every 30 minutes. GitHub often runs scheduled jobs late under load -
    # treat this as "roughly every 30-60 min", not a guarantee.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      alert_premium:
        description: "Alert when premium economy is at or below (CAD)"
        required: false
        default: "2700"
      alert_business:
        description: "Alert when business is at or below (CAD)"
        required: false
        default: "5000"

permissions:
  contents: write
  issues: write

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan fares
        id: scan
        env:
          ALERT_PREMIUM: ${{ github.event.inputs.alert_premium || '2700' }}
          ALERT_BUSINESS: ${{ github.event.inputs.alert_business || '5000' }}
          ALERT_DROP: "150"
          WINDOW_START: "2026-09-01"
          WINDOW_END: "2026-12-20"
          TRIP_LENGTHS: "14,17,21,24,26,28"
          MAX_WEEKDAYS: "20"
          # ~52 requests/run. A run at this volume worked fine; bumping to ~78
          # got the runner soft-blocked by Google, so do not lower this.
          SLICES: "16"
        run: python scripts/scan.py

      - name: Push to Telegram
        id: notify
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py

      # An alert that cannot be delivered is an alert that never happened, so
      # fall back to a GitHub issue (which emails the repo owner) whenever the
      # Telegram push does not land.
      - name: Fall back to a GitHub issue
        if: always() && steps.notify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/issue_body.py > /tmp/body.md
          if grep -qE '^\((no alerts|no alerts\.json)' /tmp/body.md; then
            echo "nothing to report - no issue opened."
            exit 0
          fi
          title="$(head -1 /tmp/body.md | sed 's/[*]//g' | cut -c1-70)"
          [ -n "$title" ] || title="flight-watch alert"
          gh issue create --title "✈️ $title" --body-file /tmp/body.md \
            --label flight-alert 2>/dev/null \
            || gh issue create --title "✈️ $title" --body-file /tmp/body.md

      - name: Commit price history
        if: always()
        run: |
          git config user.name  "flight-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/prices.json
          git diff --staged --quiet || git commit -m "prices: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have landed first; rebase before pushing.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### flight-watch"
            echo ""
            echo "- alerts: \`${{ steps.scan.outputs.count }}\`"
            echo "- blocked: \`${{ steps.scan.outputs.blocked }}\`"
            echo ""
            echo '```json'
            head -c 2000 alerts.json 2>/dev/null || echo "(no alerts.json)"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
