name: tg-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check secret hygiene (never prints the secret itself)
        run: |
          raw="${TELEGRAM_BOT_TOKEN}"
          trimmed="$(printf '%s' "$raw" | tr -d '[:space:]')"
          echo "raw length     : ${#raw}"
          echo "trimmed length : ${#trimmed}"
          if [ "${#raw}" -ne "${#trimmed}" ]; then
            echo ">>> TOKEN CONTAINS WHITESPACE (this alone breaks the URL)"
          fi
          # structure only: digits before the colon, secret length after it
          echo "chars before ':' = $(printf '%s' "$trimmed" | cut -d: -f1 | wc -c)"
          echo "chars after  ':' = $(printf '%s' "$trimmed" | cut -d: -f2- | wc -c)"
          echo "--- getMe with TRIMMED token ---"
          curl -sS -o /tmp/t.txt -w "http=%{http_code}\n" \
            "https://api.telegram.org/bot${trimmed}/getMe" || true
          cat /tmp/t.txt; echo
